[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frumpy"
version = "0.1.0"
description = "A bounded NumPy-compatible CPU array library backed by Fortran"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=2.0"]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["frumpy"]

[tool.pytest.ini_options]
pythonpath = ["python"]
